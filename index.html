<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b8f55">
  <meta name="description" content="DAILY WORK ATTENDANCE - DWA">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>DAILY WORK ATTENDANCE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(145deg, #f5faf7, #e9f5ef);
      color: #17202a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .app {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }
    .logo {
      width: 190px;
      height: 190px;
      object-fit: cover;
      border-radius: 38px;
      box-shadow: 0 18px 45px rgba(0,0,0,.14);
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: -.5px;
    }
    .subtitle {
      margin: 8px 0 28px;
      color: #607080;
      font-size: 14px;
    }
    .open-btn, .install-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .open-btn {
      background: #0b8f55;
      color: #fff;
      box-shadow: 0 10px 22px rgba(11,143,85,.22);
    }
    .install-btn {
      display: none;
      margin-top: 11px;
      background: #17202a;
      color: #fff;
    }
    .hint {
      margin-top: 18px;
      font-size: 11px;
      color: #7b8794;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="app">
   
<img class="logo" src="icon-512.png" alt="DWA Logo">

    <h1>DAILY WORK ATTENDANCE</h1>
    <div class="subtitle">Attendance Management System</div>

    <button class="open-btn" onclick="openDWA()">
      OPEN DWA
    </button>

    <button id="installBtn" class="install-btn" onclick="installDWA()">
      INSTALL DWA
    </button>

    <div class="hint">
      Gunakan tombol INSTALL DWA untuk menambahkan DWA ke layar utama
      jika perangkat/browser mendukung instalasi.
    </div>
  </main>

  <script>
    // STEP 2:
    // Nanti isi URL Web App Apps Script DWA di sini.
    const DWA_APP_URL = "https://script.google.com/macros/s/AKfycbwWsMFpC1klMp_uxcMXQYFoe6T8p57lm3NImye7MkbIAgC2jkn-hB9es0vxXz-oVFF4mw/exec";

    function openDWA() {
      if (!DWA_APP_URL || DWA_APP_URL.includes("PASTE_APPS_SCRIPT")) {
        alert("URL Web App DWA belum diisi.");
        return;
      }
      window.location.href = DWA_APP_URL;
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.style.display = "block";
    });

    async function installDWA() {
      if (!deferredPrompt) {
        alert("Gunakan menu browser: Add to Home Screen / Tambahkan ke Layar Utama.");
        return;
      }

      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => {
          console.log("Service Worker:", err);
        });
      });
    }
  </script>
</body>
</html>
